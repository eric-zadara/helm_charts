{{/*
USER_AUTH_SECRET Secret (Onyx v4+)
==================================
Wrapper-managed secret holding USER_AUTH_SECRET, which Onyx v4 uses to sign
password-reset / email-verification tokens, OAuth/OIDC login state, and captcha
cookies. v4 fails fast on startup if it is empty (v3 did not require it).

Onyx consumes this via onyx.auth.userauth.existingSecret (wired in values.yaml).

Uses the Helm `lookup` pattern so the value PERSISTS across upgrades — identical
to opensearch-admin-secret.yaml / valkey-credentials-secret.yaml. This matters
more here than for datastore passwords: if USER_AUTH_SECRET rotates, every
issued token/session is invalidated (mass logout). Under ArgoCD you MUST add
this secret to ignoreDifferences (see docs/argocd.md) so a cluster-less
`helm template` render does not churn it on every sync.

Created only when onyx.auth.userauth.enabled is true AND existingSecret points
at this wrapper-managed name. If the operator wires their own secret
(existingSecret) or sources it via External Secrets, set externalSecrets and
this template no-ops.
*/}}
{{- $managedName := "onyx-ai-userauth" -}}
{{- $existing := .Values.onyx.auth.userauth.existingSecret | default "" -}}
{{- if and .Values.onyx.auth.userauth.enabled (eq $existing $managedName) -}}
{{- $key := index .Values.onyx.auth.userauth.secretKeys "USER_AUTH_SECRET" | default "user_auth_secret" -}}
{{- $current := lookup "v1" "Secret" .Release.Namespace $managedName -}}
{{- $value := "" -}}
{{- if $current -}}
  {{- /* Reuse the existing value to avoid invalidating tokens on upgrade */ -}}
  {{- $value = index $current.data $key | b64dec -}}
{{- else -}}
  {{- /* 64-char alphanumeric — equivalent entropy to `openssl rand -hex 32` */ -}}
  {{- $value = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $managedName }}
  labels:
    {{- include "onyx-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: userauth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    helm.sh/resource-policy: keep
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
# data: + b64enc (NOT stringData) — see 0.2.5 drift-fix notes; stringData
# structurally mismatches ArgoCD's /data ignoreDifferences jsonPointer.
data:
  {{ $key }}: {{ $value | b64enc | quote }}
{{- end }}
