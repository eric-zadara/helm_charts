suite: USER_AUTH_SECRET wrapper-managed secret
release:
  name: onyx-ai
  namespace: onyx-ai
tests:
  - it: renders the managed userauth secret with a persisted-style value
    template: templates/user-auth-secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: onyx-ai-userauth
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["argocd.argoproj.io/compare-options"]
          value: IgnoreExtraneous
      - exists:
          path: data.user_auth_secret
      - notExists:
          path: stringData
  - it: no wrapper secret when the operator supplies their own existingSecret
    template: templates/user-auth-secret.yaml
    set:
      onyx.auth.userauth.existingSecret: my-own-userauth-secret
    asserts:
      - hasDocuments:
          count: 0
  - it: no wrapper secret when userauth is disabled
    template: templates/user-auth-secret.yaml
    set:
      onyx.auth.userauth.enabled: false
    asserts:
      - hasDocuments:
          count: 0
