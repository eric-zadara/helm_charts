name: Test Charts

on:
  pull_request:
    branches:
      - master
    paths:
      - 'charts/**'
      - 'ct.yaml'
      - '.github/workflows/test.yml'
  workflow_dispatch: {}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Detect changed charts
        id: detect
        run: |
          changed=$(ct list-changed --config ct.yaml 2>/dev/null || echo "")

          if [[ -z "$changed" ]]; then
            echo "No chart changes detected"
            echo "charts=[]" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed charts:"
          echo "$changed"

          # Build flat JSON array of chart names
          charts_json=$(echo "$changed" | while IFS= read -r chart_path; do
            basename "$chart_path"
          done | jq -R . | jq -s -c .)

          [[ -z "$charts_json" || "$charts_json" == '[""]' ]] && charts_json="[]"

          echo "Matrix: $charts_json"
          echo "charts=$charts_json" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  unit-test:
    name: ${{ matrix.chart }} / unit tests
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false

      - name: Set up yq
        uses: mikefarah/yq@v4.45.4

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add eric-zadara https://eric-zadara.github.io/helm_charts/
          helm repo add knative https://knative.github.io/operator
          helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
          helm repo add onyx-dot-app https://onyx-dot-app.github.io/onyx/
          helm repo add garage https://datahub-local.github.io/garage-helm
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo add opensearch-project https://opensearch-project.github.io/opensearch-k8s-operator
          helm repo update

      - name: Build chart dependencies
        run: |
          # helm-unittest renders subchart templates (e.g. charts/onyx/...,
          # charts/opensearch-cluster/...), so the dependencies must be
          # materialized first. Resolve eric-zadara sibling charts from the
          # local checkout (CI-only) the same way the install job does.
          chart_yaml="charts/${{ matrix.chart }}/Chart.yaml"
          [[ ! -f "$chart_yaml" ]] && exit 0
          deps=$(yq -r '.dependencies[]? | [.name, .version, .repository] | @tsv' "$chart_yaml" 2>/dev/null) || true
          while IFS=$'\t' read -r name version repo; do
            [[ -z "$name" ]] && continue
            [[ "$repo" != *"eric-zadara"* ]] && continue
            [[ ! -f "charts/$name/Chart.yaml" ]] && continue
            local_version=$(yq -r '.version' "charts/$name/Chart.yaml")
            if [[ "$version" == "$local_version" ]]; then
              echo "Resolving $name@$version from local checkout"
              yq -i "(.dependencies[] | select(.name == \"$name\")).repository = \"file://../$name\"" "$chart_yaml"
            fi
          done <<< "$deps"
          helm dependency build "charts/${{ matrix.chart }}"
          git checkout -- "$chart_yaml" 2>/dev/null || true

      - name: Run helm-unittest
        run: |
          if ls charts/${{ matrix.chart }}/tests/*_test.yaml 1>/dev/null 2>&1; then
            helm unittest charts/${{ matrix.chart }}
          else
            echo "No helm-unittest tests found for ${{ matrix.chart }}, skipping"
          fi

      - name: Run validation regression tests
        run: |
          if [[ -x "charts/${{ matrix.chart }}/tests/validation-regression.sh" ]]; then
            charts/${{ matrix.chart }}/tests/validation-regression.sh
          else
            echo "No validation regression tests found for ${{ matrix.chart }}, skipping"
          fi

  test:
    name: ${{ matrix.chart }} / K8s ${{ matrix.k8s-version }}
    needs: [detect-changes, unit-test]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version:
          - "1.35.0"
          - "1.34.3"
          - "1.33.7"
        chart: ${{ fromJSON(needs.detect-changes.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Set up yq
        uses: mikefarah/yq@v4.45.4

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add eric-zadara https://eric-zadara.github.io/helm_charts/
          helm repo add knative https://knative.github.io/operator
          helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
          helm repo add onyx-dot-app https://onyx-dot-app.github.io/onyx/
          helm repo add garage https://datahub-local.github.io/garage-helm
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo add opensearch-project https://opensearch-project.github.io/opensearch-k8s-operator
          helm repo update

      - name: Create kind cluster
        uses: helm/kind-action@v1.13.0
        with:
          node_image: ${{ matrix.k8s-version == '1.35.0' && 'kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f' || matrix.k8s-version == '1.34.3' && 'kindest/node:v1.34.3@sha256:08497ee19eace7b4b5348db5c6a1591d7752b164530a36f855cb0f2bdcbadd48' || 'kindest/node:v1.33.7@sha256:d26ef333bdb2cbe9862a0f7c3803ecc7b4303d8cea8e814b481b09949d353040' }}
          cluster_name: test-${{ matrix.chart }}-${{ matrix.k8s-version }}
          wait: 300s

      - name: Install prerequisites
        run: |
          prereqs=$(yq -r '.annotations["testing/prerequisites"] // ""' "charts/${{ matrix.chart }}/Chart.yaml")

          if [[ -z "$prereqs" ]]; then
            echo "No prerequisites for ${{ matrix.chart }}"
            exit 0
          fi

          echo "Installing prerequisites: $prereqs"
          IFS=',' read -ra prereq_list <<< "$prereqs"

          # Resolve local sibling chart dependencies (CI-only).
          # When a chart references eric-zadara repo with a version matching
          # a local sibling chart, temporarily rewrite to file:// so
          # helm dependency build resolves from the checkout.
          resolve_local_deps() {
            local chart_dir=$1
            local chart_yaml="$chart_dir/Chart.yaml"
            [[ ! -f "$chart_yaml" ]] && return 0

            local deps
            deps=$(yq -r '.dependencies[]? | [.name, .version, .repository] | @tsv' "$chart_yaml" 2>/dev/null) || return 0

            while IFS=$'\t' read -r name version repo; do
              [[ -z "$name" ]] && continue
              [[ "$repo" != *"eric-zadara"* ]] && continue
              [[ ! -f "charts/$name/Chart.yaml" ]] && continue

              local local_version
              local_version=$(yq -r '.version' "charts/$name/Chart.yaml")
              if [[ "$version" == "$local_version" ]]; then
                echo "  Resolving $name@$version from local checkout"
                yq -i "(.dependencies[] | select(.name == \"$name\")).repository = \"file://../$name\"" "$chart_yaml"
              fi
            done <<< "$deps"
          }

          # Idempotent install of a local chart prerequisite
          install_prereq() {
            local chart=$1 timeout=$2
            if helm status "$chart" -n default &>/dev/null; then
              echo "$chart already installed, skipping"
              return 0
            fi
            echo "Installing $chart..."
            resolve_local_deps "charts/$chart"
            helm dependency build "charts/$chart"
            git checkout -- "charts/$chart/Chart.yaml" 2>/dev/null || true
            local values_args=""
            if [[ -f "charts/$chart/ci/default-values.yaml" ]]; then
              values_args="-f charts/$chart/ci/default-values.yaml"
            fi
            helm install "$chart" "charts/$chart" \
              $values_args \
              --namespace default \
              --wait --timeout "$timeout"
          }

          for prereq in "${prereq_list[@]}"; do
            case "$prereq" in
              cert-manager)
                echo "Installing cert-manager..."
                helm repo add jetstack https://charts.jetstack.io
                helm repo update
                helm install cert-manager jetstack/cert-manager \
                  --namespace cert-manager --create-namespace \
                  --set crds.enabled=true \
                  --wait --timeout 5m
                ;;
              cnpg-operator)
                echo "Installing CNPG operator..."
                # Pin to 0.22.0 (CNPG 1.24.0) to match production, which deploys
                # cloudnative-pg via argo-examples-operators (targetRevision:
                # 0.22.0). The unpinned latest is several minor versions newer
                # and reconciles the cluster chart's Pooler CR differently.
                helm install cnpg cnpg/cloudnative-pg \
                  --version 0.22.0 \
                  --namespace cnpg-system --create-namespace \
                  --wait --timeout 5m
                ;;
              opensearch-operator)
                echo "Installing OpenSearch operator..."
                # Pin to 3.0.2 to match production, which deploys this operator
                # via the argo-examples-operators chart (targetRevision: 3.0.2).
                # webhook.enabled=false skips the cert-manager Certificate/Issuer
                # the operator would otherwise create for its admission webhook
                # (cert-manager isn't installed); the operator still ships the
                # opensearch.org CRDs and reconciles the CR.
                # NOTE: not used by the default CI install (see opensearch-standalone)
                # — kept for profiles that exercise the operator-managed cluster.
                helm install opensearch-operator opensearch-project/opensearch-operator \
                  --version 3.0.2 \
                  --namespace opensearch-operator-system --create-namespace \
                  --set webhook.enabled=false \
                  --wait --timeout 5m
                ;;
              opensearch-standalone)
                echo "Deploying standalone OpenSearch (CI external backend)..."
                # A single-node, security-disabled OpenSearch the chart points at
                # via externalOpenSearch. Avoids the operator's flaky single-node
                # bootstrap on kind (see ci/opensearch-standalone.yaml).
                kubectl apply -f charts/${{ matrix.chart }}/ci/opensearch-standalone.yaml
                kubectl wait --for=condition=available deploy/opensearch-ci \
                  --namespace default --timeout 5m
                ;;
              inference-crds)
                install_prereq inference-crds 5m
                ;;
              inference-operators)
                install_prereq inference-crds 5m
                install_prereq inference-operators 15m
                ;;
              inference-infrastructure)
                install_prereq inference-crds 5m
                install_prereq inference-operators 15m
                install_prereq inference-infrastructure 15m
                ;;
              *)
                echo "Unknown prerequisite: $prereq"
                ;;
            esac
          done

      - name: Build chart dependencies
        run: |
          # Resolve local sibling chart dependencies (CI-only)
          chart_yaml="charts/${{ matrix.chart }}/Chart.yaml"
          deps=$(yq -r '.dependencies[]? | [.name, .version, .repository] | @tsv' "$chart_yaml" 2>/dev/null) || true

          while IFS=$'\t' read -r name version repo; do
            [[ -z "$name" ]] && continue
            [[ "$repo" != *"eric-zadara"* ]] && continue
            [[ ! -f "charts/$name/Chart.yaml" ]] && continue

            local_version=$(yq -r '.version' "charts/$name/Chart.yaml")
            if [[ "$version" == "$local_version" ]]; then
              echo "Resolving $name@$version from local checkout"
              yq -i "(.dependencies[] | select(.name == \"$name\")).repository = \"file://../$name\"" "$chart_yaml"
            fi
          done <<< "$deps"

          helm dependency build "charts/${{ matrix.chart }}"

          # Restore Chart.yaml after local resolution
          git checkout -- "$chart_yaml" 2>/dev/null || true

      - name: Pre-pull chart images into kind
        run: |
          # Pre-pull the chart's onyx images directly into the kind node's
          # containerd BEFORE install. Two reasons:
          #   1. Disk: `crictl pull` stores ONE copy (in the node's containerd).
          #      `docker pull` + `kind load` stores the image twice (runner docker
          #      AND containerd) — the multi-GB onyx-backend / onyx-model-server
          #      (CUDA/cuDNN) images can then exhaust the runner root disk
          #      ("no space left on device").
          #   2. Timing: with imagePullPolicy IfNotPresent the pods reuse these,
          #      so the pulls don't run during `helm install --wait` and blow each
          #      Deployment's progressDeadlineSeconds (k8s default 600s, which
          #      onyx's api/celery/model deployments don't override).
          # No-op for charts without onyxdotapp images.
          VALUES_ARGS=""
          if [[ -f "charts/${{ matrix.chart }}/ci/default-values.yaml" ]]; then
            VALUES_ARGS="-f charts/${{ matrix.chart }}/ci/default-values.yaml"
          fi
          imgs=$(helm template "${{ matrix.chart }}" "charts/${{ matrix.chart }}" $VALUES_ARGS 2>/dev/null \
            | grep -oE 'image: *"?[^"[:space:]]+' | awk '{print $2}' | tr -d '"' \
            | sort -u | grep -iE 'onyxdotapp' || true)
          node="test-${{ matrix.chart }}-${{ matrix.k8s-version }}-control-plane"
          for img in $imgs; do
            echo "::group::pre-pull $img"
            docker exec "$node" crictl pull "$img" || echo "skip $img"
            echo "::endgroup::"
          done

      - name: Install chart
        run: |
          VALUES_ARGS=""
          if [[ -f "charts/${{ matrix.chart }}/ci/default-values.yaml" ]]; then
            VALUES_ARGS="-f charts/${{ matrix.chart }}/ci/default-values.yaml"
            echo "Using CI values: charts/${{ matrix.chart }}/ci/default-values.yaml"
          fi

          TIMEOUT=$(yq -r '.annotations["testing/timeout"] // "600s"' "charts/${{ matrix.chart }}/Chart.yaml")
          echo "Install timeout: $TIMEOUT"

          helm install ${{ matrix.chart }} charts/${{ matrix.chart }} \
            $VALUES_ARGS \
            --namespace default \
            --wait \
            --timeout "$TIMEOUT"

      - name: Verify installation
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A
          echo ""
          echo "=== Resources in default namespace ==="
          kubectl get all -n default
          echo ""
          echo "=== CRDs ==="
          kubectl get crd 2>/dev/null | head -30 || true

      - name: Run helm test
        run: |
          helm test ${{ matrix.chart }} --namespace default --timeout 300s

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== All pods ==="
          kubectl get pods -A -o wide || true
          echo ""
          # Select pods that are NOT Ready (covers CrashLoopBackOff/Error, which
          # report phase=Running, so a phase filter would miss them). Each line:
          # "<ns> <name>".
          not_ready=$(kubectl get pods -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace} {.metadata.name} {range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' 2>/dev/null \
            | awk '$3!="True"{print $1" "$2}')
          echo "=== Not-Ready pods: describe + logs ==="
          echo "$not_ready" | while read -r ns name; do
            [ -z "$name" ] && continue
            echo "----- $ns/$name -----"
            kubectl describe pod "$name" -n "$ns" 2>/dev/null | sed -n '/^Events:/,$p'
            for c in $(kubectl get pod "$name" -n "$ns" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
              echo "--- logs $ns/$name [$c] (current) ---"
              kubectl logs "$name" -n "$ns" -c "$c" --tail=60 2>&1 | tail -60 || true
              echo "--- logs $ns/$name [$c] (previous) ---"
              kubectl logs "$name" -n "$ns" -c "$c" --previous --tail=60 2>&1 | tail -60 || true
            done
            echo ""
          done
          echo "=== CNPG clusters / poolers ==="
          kubectl get clusters.postgresql.cnpg.io,poolers.postgresql.cnpg.io -A 2>/dev/null || true
          echo "=== OpenSearchClusters ==="
          kubectl get opensearchclusters.opensearch.org -A 2>/dev/null || true
          echo "=== Recent events ==="
          kubectl get events -A --sort-by='.lastTimestamp' 2>/dev/null | tail -60
